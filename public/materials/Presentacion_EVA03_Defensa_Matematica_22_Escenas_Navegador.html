<style>
:root{--paper:#f8fcff;--ice:#e3f1ff;--pale:#a7cce8;--blue:#5a82a6;--navy:#2c4d6b;--ink:#20374d;--purple:#4b2c6b;--line:#bdd6e8;--faint:#f0f7fd}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{background:#d9e6f0;color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;overflow:hidden}
button{font:inherit}button:focus-visible{outline:3px solid var(--purple);outline-offset:3px}

.phase{position:absolute;left:5.6%;top:5.1%;font-size:1.15cqw;font-weight:700;color:var(--purple)}
.count{position:absolute;right:5.6%;top:5.1%;font-size:1.15cqw;font-weight:700;color:var(--blue)}

.eyebrow{font-size:1.08cqw;font-weight:700;color:var(--blue)}.formula{font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:3.0cqw;line-height:1.15;color:var(--navy);overflow-wrap:anywhere}

.result{position:absolute;left:67%;top:47%;width:27.4%;height:32%;border:1px solid #c8b6dd;background:#f6f2fb;padding:1.6%;display:flex;flex-direction:column;justify-content:center;gap:1cqw}
.result-label{font-size:1.08cqw;font-weight:800;color:var(--purple)}.result-value{white-space:pre-line;font-size:3.25cqw;line-height:1.05;font-weight:760;letter-spacing:-.035em;color:var(--purple);overflow-wrap:anywhere}.result-value.long{font-size:2.5cqw}.result-value.verylong{font-size:2.2cqw}.result-caption{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:1.55cqw;line-height:1.2;letter-spacing:0;text-transform:none;color:var(--navy)}
.meaning{position:absolute;left:5.6%;right:5.6%;bottom:5.2%;height:11.5%;padding-top:1.2%;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:.5cqw}.meaning-label{font-size:1.0cqw;font-weight:800;color:var(--blue)}.meaning-text{font-size:1.53cqw;line-height:1.26}
.reveal{opacity:0;transform:translateY(.8cqw);filter:blur(3px);transition:opacity .43s ease,transform .43s ease,filter .43s ease}.reveal.shown{opacity:1;transform:translateY(0);filter:blur(0)}
.controls{height:60px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 22px;background:#edf5fb;border-top:1px solid #b8d0e3;color:var(--navy);font-size:13px}
.control-group{display:flex;align-items:center;gap:8px}.controls button{border:1px solid #9bb8ce;border-radius:9px;background:#fff;color:var(--ink);min-height:34px;padding:4px 12px;cursor:pointer}.controls button:hover{background:var(--ice)}.controls button.primary{background:var(--purple);color:#fff;border-color:var(--purple)}.controls button.primary:hover{background:#624080}.controls button:disabled{opacity:.45;cursor:default}
.progress{width:min(20vw,210px);height:5px;border-radius:99px;background:#c9dae8;overflow:hidden}.progress>i{display:block;height:100%;background:var(--purple);width:0;transition:width .3s}

@media(max-width:700px){.controls{height:58px;padding:0 8px;gap:5px}.controls button{padding:3px 7px;font-size:12px}.hint,.progress,.cue{display:none}.stage{padding:3px}.slide{width:100%}}
@media(prefers-reduced-motion:reduce){.reveal,.progress>i{transition:none}}

.given{min-width:0;border-left:1px solid var(--line);padding-left:1.8cqw;display:flex;flex-direction:column;justify-content:center;gap:.45cqw}.given-line{font-size:1.32cqw;font-weight:550;line-height:1.2;overflow-wrap:anywhere}
.procedure-label{top:47.3%}.steps{top:51%;height:29%}.step{font-size:1.60cqw;line-height:1.22}.result{top:47.8%;height:32.2%}.result-value.verylong{font-size:1.95cqw}.meaning-text{font-size:1.45cqw}

<script>
const slides=[{"phase":"PUNTO DE PARTIDA","title":"Una base en un mismo terreno","formula":"z = f(x, y)","steps":["En el centro: f(0,0)=18+6(−1)²=24 m.","En P=(40,−20): f(P)=21.4359375 m.","Ruta y depósito usan esta misma función y escala."],"result":"6 fases","resultCaption":"un sistema de coordenadas","meaning":"La propuesta es académica: las decisiones se comprueban con cálculo y después se ven en el modelo.","inputs":["Escala: 1 unidad = 1 m","Terreno: radio 110 m","Ruta: radio 72 m","Depósito: semiejes 18, 14 y 8 m"]},{"phase":"I · TERRENO","title":"La función que da la altura","formula":"f(x,y)=18+6[(x²+y²)/6400−1]²\n+0.012x−0.006y","formulaSize":31,"steps":["x²+y²=40²+(−20)²=2000.","s=2000/6400−1=−0.6875; s²=0.47265625.","f(P)=18+6(0.47265625)+0.480+0.120."],"result":"21.4359375 m","resultCaption":"altura del terreno en P","meaning":"La misma receta asigna una altura a cada posición. El disco de radio 110 m delimita el estudio.","inputs":["P=(40,−20) m","6400=80²","D: x²+y²≤110²","Dom(f)=ℝ²"]},{"phase":"I · TERRENO","title":"Cómo leemos el relieve","formula":"f(x,y) = k   →   misma elevación","steps":["Centro: f(A)=18+6(−1)²=24.000 m.","P: f(40,−20)=21.435938 m.","Llegada: f(B⁺)≈19.182581 m."],"result":"6 niveles","resultCaption":"más dos trazas y tres cotas","meaning":"Curvas muy juntas anuncian mayor cambio de altura; las trazas dejan ver la forma de lado.","inputs":["k={17,18.5,20,21.5,23,24} m","Cortes: x=0 e y=0","A=(0,0); P=(40,−20)","B⁺≈(64.398758,−32.199379)"]},{"phase":"II · CAMBIO LOCAL","title":"Plano tangente y normal en P","formula":"z−f(P)=fₓ(P)(x−40)+fᵧ(P)(y+20)","formulaSize":34,"steps":["fₓ(P)=(3·40/800)(−0.6875)+0.012=−0.091125.","fᵧ(P)=(3·(−20)/800)(−0.6875)−0.006=0.0455625.","n(P)=(0.091125,−0.0455625,1)."],"result":"z=21.4359375\n−0.091125(x−40)\n+0.0455625(y+20)","resultSize":39,"resultCaption":"plano con los datos sustituidos","meaning":"El plano aproxima la loma cerca de P; las segundas derivadas describen cómo cambia la pendiente.","inputs":["P=(40,−20) m","f(P)=21.4359375 m","s(P)=−0.6875","n=(−fₓ,−fᵧ,1)"]},{"phase":"II · CAMBIO LOCAL","title":"El error de una predicción cercana","formula":"error = |f(H)−L(H)|","steps":["L(H)=21.4359375−0.091125(4)+0.0455625(3)=21.208125.","f(H)=18+6(2225/6400−1)²+0.528+0.102≈21.183314209.","|21.208125−21.183314209|≈0.024810791 m."],"result":"2.481 cm","resultCaption":"error absoluto en H","meaning":"El plano sobreestima la altura en H. Error relativo ≈0.1171 %. La ampliación visual ×80 solo facilita verlo.","inputs":["P=(40,−20); H=(44,−17)","H−P=(4,3) m","L: plano calculado en P","Todas las alturas se expresan en m"]},{"phase":"II · GRADIENTE","title":"Dónde aumenta más la altura","formula":"∇f(P) = (fₓ(P), fᵧ(P))","steps":["‖∇f(P)‖=√[(−0.091125)²+0.0455625²]≈0.101880847.","Ascenso: ∇f(P)/‖∇f(P)‖≈(−0.894427,0.447214).","En Q: √(0.09036914²+0.06085840²)≈0.108951027."],"result":"10.1881 %","resultCaption":"pendiente máxima local en P","meaning":"0.101881 m/m equivale a 10.1881 cm de subida por metro horizontal. En Q la pendiente máxima es 10.8951 %.","inputs":["P=(40,−20) m","∇f(P)=(−0.091125,0.0455625)","Q=(−50,35) m","∇f(Q)≈(0.09036914,−0.06085840)"]},{"phase":"II · DIRECCIONES","title":"Pendiente en un rumbo elegido","formula":"Dᵤf(Q) = ∇f(Q) · u     con ‖u‖=1","formulaSize":34,"steps":["‖u‖=√[(1/√5)²+(−2/√5)²]=1.","Dᵤf(Q)=[0.09036914+2(0.06085840)]/√5.","Dᵤf(Q)≈0.094847715 m/m."],"result":"9.4848 cm/m","resultCaption":"subida local en el rumbo elegido","meaning":"En el rumbo elegido en P se obtiene −0.018225 m/m: allí descendemos.","inputs":["Q=(−50,35) m","∇f(Q)≈(0.09036914,−0.06085840)","u=(1,−2)/√5","La dirección u tiene longitud 1"]},{"phase":"II · TRAYECTORIA","title":"La altura cambia al movernos","formula":"z′(t) = fₓ x′(t) + fᵧ y′(t)","steps":["En el anillo: q=(3/800)(72²/6400−1)=−0.0007125.","z′=(qx+0.012)(−72 sen t)+(qy−0.006)(72 cos t).","Se cancela la parte radial: z′=−0.864 sen t−0.432 cos t."],"result":"−0.965981\nm/rad","resultSize":33,"resultCaption":"z′ en el punto de control t*","meaning":"En t* el descenso longitudinal es máximo. z′ es negativo dentro del tramo y cero en sus extremos. t es angular.","inputs":["Radio de la ruta: 72 m","t₀=−atan(1/2)≈−0.463648","t₁=t₀+π≈2.677945","Caso: t*=π/2−atan(1/2)≈1.107149"]},{"phase":"III · EXTREMOS","title":"Valle, cima y punto de silla","formula":"p(x)=1.25x³/6400−x+3.2=0\nΔ=fₓₓfᵧᵧ−fₓᵧ²","formulaSize":34,"steps":["(−73.103493,36.551746): Δ≈1.312·10⁻⁶; fₓₓ≈0.006427.","(3.206439,−1.603219): Δ≈1.395·10⁻⁵; fₓₓ≈−0.003730.","(69.897054,−34.948527): Δ≈−1.199·10⁻⁶."],"result":"mínimo\nmáximo\nsilla","resultCaption":"clasificación de los tres candidatos","meaning":"La clasificación es local y explica el relieve; todavía no elige la plataforma de llegada.","inputs":["Resolver fₓ=fᵧ=0","La reducción da y=−x/2","Raíces en [−74,−72], [3,4], [69,71]","Clasificar con Δ y el signo de fₓₓ"]},{"phase":"III · LAGRANGE","title":"Elegir la llegada sobre r = 72","formula":"∇F=λ∇g; F=fₓ²+fᵧ²\ng=x²+y²=72²=5184","formulaSize":34,"steps":["Eliminar λ da y=−x/2; al sustituir: 1.25x²=5184.","B±=±(64.398758,−32.199379) m.","F(B⁺)≈0.00143516655; F(B⁻)≈0.00418821345."],"result":"3.788359 %","resultCaption":"100√F(B⁺), menor pendiente","meaning":"B⁻ da 6.471641 %. La reducción relativa es 41.46 %. La comparación solo vale sobre el círculo adoptado.","inputs":["Radio de comparación: 72 m","b=(0.012,−0.006)","Sobre el círculo: q=−0.0007125","Se comparan todos los candidatos"]},{"phase":"IV · MOVIMIENTO","title":"Un rover sobre la misma superficie","formula":"r(t)=(72 cos t,72 sen t,\n18.2166+0.864 cos t−0.432 sen t)","formulaSize":31,"steps":["r(t*)≈(32.199379,64.398758,18.216600) m.","r′(t*)≈(−64.398758,32.199379,−0.965981).","r″(t*)≈(−32.199379,−64.398758,0)."],"result":"T≈(−0.894347,\n0.447173,−0.013415)","resultCaption":"rumbo unitario en t*","meaning":"Las cifras corresponden al punto de control de la ruta. Para velocidad física se necesita una ley temporal t(τ).","inputs":["t₀≈−0.463648; t₁≈2.677945 rad","Caso: t*≈1.107149 rad","r′ y r″ se derivan respecto de t","T=r′/‖r′‖ es un vector unitario"]},{"phase":"IV · DISTANCIA","title":"Sumar todos los tramos de ruta","formula":"L=∫[t₀,t₁] √[5184+\n(−0.864 sen t−0.432 cos t)²] dt","steps":["‖r′‖=√(72²+z′²); integramos en un tramo de π rad.","16, 32 y 64 nodos: L≈226.204849475 m.","72π≈226.194671 m; diferencia≈0.010178 m."],"result":"226.204849 m","resultCaption":"longitud espacial del tramo principal","meaning":"El relieve añade unos 1.018 cm frente a la proyección horizontal de este tramo. El ramal al taller se mide aparte.","inputs":["t₀=−atan(1/2)","t₁=π−atan(1/2)","Radio horizontal: 72 m","Método numérico: Gauss–Legendre"]},{"phase":"IV · CURVATURA","title":"Cuánto gira la ruta","formula":"κ = ‖r′×r″‖ / ‖r′‖³","steps":["r′×r″=(−62.208,31.104,5184).","κ=5184.466539/373348.781495≈0.013886389 m⁻¹.","R=1/0.013886389≈72.012959 m."],"result":"72.01296 m","resultCaption":"radio local en el punto de control","meaning":"Un radio mayor indica giro más suave. La velocidad segura requiere más supuestos.","inputs":["Caso: t*≈1.107149 rad","‖r′(t*)‖≈72.006480","Se usan r′ y r″ de la lámina anterior","Radio local R=1/κ"]},{"phase":"V · REGIÓN R","title":"Definir la rebanada de terreno","formula":"60 ≤ r ≤ 72;    −π/4 ≤ θ ≤ 0","steps":["En polares: A=∫[−π/4,0]∫[60,72] r dr dθ.","∫[60,72] r dr=(72²−60²)/2=792 m².","A=792(π/4)=198π≈622.035345 m²."],"result":"622.035 m²","resultCaption":"proyección horizontal de R","meaning":"R ocupa 45° entre dos circunferencias. El área del suelo inclinado se calcula después.","inputs":["Radio interior: 60 m","Radio exterior: 72 m","Ángulos: −π/4 a 0 rad","Abertura: π/4=45°"]},{"phase":"V · INTEGRAL DOBLE","title":"Volumen bajo el terreno en R","formula":"V=∫[−π/4,0]∫[60,72] f(r cosθ,r senθ) r dr dθ","formulaSize":32,"steps":["K(r)=12r²−3r⁴/6400+r⁶/6400².","K(72)−K(60)=14748.0399; aporte radial≈11583.083451 m³.","(72³−60³)[0.004/√2+0.002(1−1/√2)]≈536.878254 m³."],"result":"12 119.9
