<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>EVA03 · Defensa matemática · 22 escenas</title>
<style>
:root{--paper:#f8fcff;--ice:#e3f1ff;--pale:#a7cce8;--blue:#5a82a6;--navy:#2c4d6b;--ink:#20374d;--purple:#4b2c6b;--line:#bdd6e8;--faint:#f0f7fd}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{background:#d9e6f0;color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;overflow:hidden}
button{font:inherit}button:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.app{height:100dvh;display:grid;grid-template-rows:1fr auto;gap:0}
.stage{display:grid;place-items:center;min-height:0;padding:12px}
.slide{position:relative;width:min(100%,calc((100dvh - 72px)*16/9));aspect-ratio:16/9;background:var(--paper);overflow:hidden;box-shadow:0 18px 60px #20374d26;container-type:inline-size}
.slide:before{content:"";position:absolute;inset:0 0 auto;height:.65%;background:linear-gradient(90deg,var(--blue) 0 30%,var(--pale) 30% 71%,var(--purple) 71% 100%)}
.phase,.count,.eyebrow,.small,.step-index,.result-label,.result-caption,.meaning-label{font-family:"Cascadia Mono","Consolas",monospace;letter-spacing:.095em;text-transform:uppercase}
.phase{position:absolute;left:5.6%;top:5.1%;font-size:1.15cqw;font-weight:700;color:var(--purple)}
.count{position:absolute;right:5.6%;top:5.1%;font-size:1.15cqw;font-weight:700;color:var(--blue)}
.title{position:absolute;left:5.6%;top:10.7%;width:88.8%;margin:0;font-size:3.45cqw;line-height:1.07;letter-spacing:-.045em;font-weight:750;color:var(--ink)}
.formula-wrap{position:absolute;left:5.6%;top:23.1%;width:88.8%;height:20.3%;background:linear-gradient(100deg,#edf7ff,#f5f1fa);border-left:.55cqw solid var(--blue);padding:1.4% 2%;display:flex;flex-direction:column;justify-content:center;gap:.55cqw}
.eyebrow{font-size:1.08cqw;font-weight:700;color:var(--blue)}.formula{font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:3.0cqw;line-height:1.15;color:var(--navy);overflow-wrap:anywhere}
.formula.long{font-size:2.45cqw}.formula.verylong{font-size:2.13cqw}
.formula.visual-integral{font-size:2.4cqw;white-space:nowrap}.math-int{display:inline-block;position:relative;font-size:1.2em;padding-right:.4em;vertical-align:middle}.math-int sup,.math-int sub{position:absolute;font-size:.38em;line-height:1;left:1.18em;font-weight:400}.math-int sup{top:-.2em}.math-int sub{bottom:-.31em}
.procedure-label{position:absolute;left:5.6%;top:46.7%;font-size:1.08cqw;font-weight:700;color:var(--purple)}
.steps{position:absolute;left:5.6%;top:52%;width:58.5%;height:27%;display:grid;grid-template-rows:repeat(3,1fr)}
.step{display:grid;grid-template-columns:4.8cqw 1fr;align-items:center;border-top:1px solid var(--line);font-size:1.76cqw;line-height:1.19;font-weight:500}.step:last-child{border-bottom:1px solid var(--line)}.step-index{font-size:1.83cqw;font-weight:800;color:var(--purple)}
.result{position:absolute;left:67%;top:47%;width:27.4%;height:32%;border:1px solid #c8b6dd;background:#f6f2fb;padding:1.6%;display:flex;flex-direction:column;justify-content:center;gap:1cqw}
.result-label{font-size:1.08cqw;font-weight:800;color:var(--purple)}.result-value{white-space:pre-line;font-size:3.25cqw;line-height:1.05;font-weight:760;letter-spacing:-.035em;color:var(--purple);overflow-wrap:anywhere}.result-value.long{font-size:2.5cqw}.result-value.verylong{font-size:2.2cqw}.result-caption{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:1.55cqw;line-height:1.2;letter-spacing:0;text-transform:none;color:var(--navy)}
.meaning{position:absolute;left:5.6%;right:5.6%;bottom:5.2%;height:11.5%;padding-top:1.2%;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:.5cqw}.meaning-label{font-size:1.0cqw;font-weight:800;color:var(--blue)}.meaning-text{font-size:1.53cqw;line-height:1.26}
.reveal{opacity:0;transform:translateY(.8cqw);filter:blur(3px);transition:opacity .43s ease,transform .43s ease,filter .43s ease}.reveal.shown{opacity:1;transform:translateY(0);filter:blur(0)}
.controls{height:60px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 22px;background:#edf5fb;border-top:1px solid #b8d0e3;color:var(--navy);font-size:13px}
.control-group{display:flex;align-items:center;gap:8px}.controls button{border:1px solid #9bb8ce;border-radius:9px;background:#fff;color:var(--ink);min-height:34px;padding:4px 12px;cursor:pointer}.controls button:hover{background:var(--ice)}.controls button.primary{background:var(--purple);color:#fff;border-color:var(--purple)}.controls button.primary:hover{background:#624080}.controls button:disabled{opacity:.45;cursor:default}
.progress{width:min(20vw,210px);height:5px;border-radius:99px;background:#c9dae8;overflow:hidden}.progress>i{display:block;height:100%;background:var(--purple);width:0;transition:width .3s}
.cue{font-weight:700;color:var(--purple)}.hint{color:#59738a}
@media(max-width:700px){.controls{height:58px;padding:0 8px;gap:5px}.controls button{padding:3px 7px;font-size:12px}.hint,.progress,.cue{display:none}.stage{padding:3px}.slide{width:100%}}
@media(prefers-reduced-motion:reduce){.reveal,.progress>i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <main class="stage"><article class="slide" id="slide" aria-label="Lámina de defensa matemática"></article></main>
  <nav class="controls" aria-label="Controles de presentación">
    <div class="control-group"><button id="prev" title="Flecha izquierda">← Atrás</button><button class="primary" id="next" title="Flecha derecha o espacio">Continuar →</button><span id="status"></span></div>
    <div class="control-group"><span id="cue" class="cue"></span><span class="hint">← → / Espacio · F pantalla completa</span><span class="progress"><i id="bar"></i></span><button id="full" title="Pantalla completa">⛶</button></div>
  </nav>
</div>
<script>
const slides=[{"phase":"PUNTO DE PARTIDA","title":"Una base en un mismo terreno","formula":"z = f(x, y)","steps":["Elegimos una escala: 1 unidad = 1 metro.","Cada posición (x, y) recibe una altura z.","Sobre ese suelo ubicamos ruta, región R y depósito E."],"result":"6 fases","resultCaption":"un sistema de coordenadas","meaning":"La propuesta es académica: las decisiones se comprueban con cálculo y después se ven en el modelo."},{"phase":"I · TERRENO","title":"La función que da la altura","formula":"f(x,y)=18+6[(x²+y²)/6400−1]²+0.012x−0.006y","formulaSize":31,"steps":["Calculamos f para cualquier par (x, y).","La fórmula existe en todo ℝ²: es un polinomio.","Para el diseño usamos D: x²+y² ≤ 110²."],"result":"110 m","resultCaption":"radio del sector estudiado","meaning":"D limita dónde tomamos decisiones; fuera del disco solo aparece paisaje de contexto."},{"phase":"I · TERRENO","title":"Cómo leemos el relieve","formula":"f(x,y) = k   →   misma elevación","steps":["Fijamos una altura k y dibujamos su curva.","Trazamos dos cortes verticales del terreno.","Evaluamos f en tres puntos de referencia."],"result":"6 niveles","resultCaption":"más dos trazas y tres cotas","meaning":"Curvas muy juntas anuncian mayor cambio de altura; las trazas dejan ver la forma de lado."},{"phase":"II · CAMBIO LOCAL","title":"Plano tangente y normal en P","formula":"z−f(P)=fₓ(P)(x−40)+fᵧ(P)(y+20)","formulaSize":34,"steps":["Derivamos f respecto de x y de y.","En P=(40,−20): fₓ=−0.091125; fᵧ=0.0455625.","La normal es (−fₓ(P), −fᵧ(P), 1)."],"result":"21.43594 m","resultSize":39,"resultCaption":"altura f(P) donde toca el plano","meaning":"El plano aproxima la loma cerca de P; las segundas derivadas describen cómo cambia la pendiente."},{"phase":"II · CAMBIO LOCAL","title":"El error de una predicción cercana","formula":"error = |f(H)−L(H)|","steps":["Usamos el plano L construido en P.","En H=(44,−17): L(H)=21.20813 m.","El terreno real da f(H)=21.18331 m."],"result":"2.48 cm","resultCaption":"error absoluto en H","meaning":"Una superficie curva y un plano coinciden cerca del contacto; al alejarnos, la diferencia crece."},{"phase":"II · GRADIENTE","title":"Dónde aumenta más la altura","formula":"∇f(P) = (fₓ(P), fᵧ(P))","steps":["Calculamos las dos pendientes en P.","La flecha ∇f marca el ascenso máximo.","La flecha −∇f marca el descenso máximo."],"result":"10.19 cm/m","resultCaption":"pendiente máxima local en P","meaning":"En Q la magnitud cambia: 0.108951 m/m. La pendiente depende del lugar."},{"phase":"II · DIRECCIONES","title":"Pendiente en un rumbo elegido","formula":"Dᵤf(Q) = ∇f(Q) · u     con ‖u‖=1","formulaSize":34,"steps":["En Q elegimos u=(1,−2)/√5.","Multiplicamos ∇f(Q)·u=0.094848.","El signo positivo indica subida."],"result":"0.094848","resultCaption":"m/m de ascenso en Q","meaning":"En el rumbo elegido en P se obtiene −0.018225 m/m: allí descendemos."},{"phase":"II · TRAYECTORIA","title":"La altura cambia al movernos","formula":"z′(t) = fₓ x′(t) + fᵧ y′(t)","steps":["Tomamos x=72 cos t e y=72 sen t.","Sustituimos la ruta en z(t)=f(x(t),y(t)).","Derivamos con la regla de la cadena."],"result":"−0.864 sen t\n−0.432 cos t","resultSize":33,"resultCaption":"cambio de altura respecto de t","meaning":"t es un ángulo; para hablar de velocidad física hace falta t como función del tiempo."},{"phase":"III · EXTREMOS","title":"Valle, cima y punto de silla","formula":"fₓ = fᵧ = 0;   Δ = fₓₓfᵧᵧ − fₓᵧ²","formulaSize":34,"steps":["Resolvemos ∇f=0 para los puntos críticos.","Si Δ>0, fₓₓ distingue mínimo y máximo.","Si Δ\u003c0, tenemos una silla."],"result":"3 puntos","resultCaption":"clasificados en el terreno","meaning":"La clasificación es local y explica el relieve; todavía no elige la plataforma de llegada."},{"phase":"III · LAGRANGE","title":"Elegir la llegada sobre r = 72","formula":"min F=‖∇f‖²    sujeto a x²+y²=72²","formulaSize":34,"steps":["Medimos la pendiente máxima local con F.","Resolvemos ∇F=λ∇g sobre el círculo.","Comparamos las soluciones B⁺ y B⁻."],"result":"3.788 %","resultCaption":"pendiente de B⁺","meaning":"B⁻ da 6.472 %. B⁺ sirve como llegada dentro de esa frontera de comparación."},{"phase":"IV · MOVIMIENTO","title":"Un rover sobre la misma superficie","formula":"r(t) = (72 cos t, 72 sen t, f(72 cos t,72 sen t))","formulaSize":31,"steps":["Las dos primeras coordenadas marcan el camino.","La tercera usa la altura del mismo terreno.","v=r′, a=r″ y T=r′/‖r′‖."],"result":"ruta 3D","resultCaption":"posición, movimiento y rumbo","meaning":"La tangente T indica hacia dónde avanza el rover en cada instante del parámetro."},{"phase":"IV · DISTANCIA","title":"Sumar todos los tramos de ruta","formula":"L = ∫ ‖r′(t)‖ dt","steps":["Derivamos la posición r(t).","Su norma da longitud por unidad de parámetro.","Integramos sobre el recorrido completo."],"result":"226.205 m","resultCaption":"longitud espacial","meaning":"La ruta sobre el relieve supera su proyección horizontal; el ramal al taller se mide aparte."},{"phase":"IV · CURVATURA","title":"Cuánto gira la ruta","formula":"κ = ‖r′×r″‖ / ‖r′‖³","steps":["Comparamos dirección y cambio de dirección.","El cociente produce curvatura en m⁻¹.","El radio local se obtiene con 1/κ."],"result":"72.01 m","resultCaption":"radio local aproximado","meaning":"Un radio mayor indica giro más suave. La velocidad segura requiere más supuestos."},{"phase":"V · REGIÓN R","title":"Definir la rebanada de terreno","formula":"60 ≤ r ≤ 72;    −π/4 ≤ θ ≤ 0","steps":["Dos radios forman los bordes curvos.","Dos ángulos forman los lados rectos.","A=½(72²−60²)(π/4)."],"result":"622.035 m²","resultCaption":"proyección horizontal de R","meaning":"R ocupa 45° entre dos circunferencias. El área del suelo inclinado se calcula después."},{"phase":"V · INTEGRAL DOBLE","title":"Volumen bajo el terreno en R","formula":"V=∫[−π/4,0]∫[60,72] f(r cosθ,r senθ) r dr dθ","formulaSize":32,"steps":["La altura de cada columna es f(x,y).","El factor r corrige el área polar.","Sumamos todas las columnas del sector."],"result":"12 119.962 m³","resultSize":38,"resultCaption":"volumen respecto de z=0","meaning":"Dividir este volumen entre 622.035 m² da la elevación media: 19.484 m."},{"phase":"V · SUELO REAL","title":"La pendiente aumenta el área","formula":"Aₛ = ∬ᵣ √(1+fₓ²+fᵧ²) dA","formulaSize":35,"steps":["La proyección horizontal usa solo dA.","La superficie inclinada añade el factor de pendiente.","Integramos ambos sobre la misma R."],"result":"623.365 m²","resultSize":40,"resultCaption":"área real del relieve","meaning":"La diferencia es 1.330 m², o 0.214 %. No equivale al área activa de paneles."},{"phase":"VI · DEPÓSITO E","title":"La forma que vamos a integrar","formula":"u²/18² + v²/14² + w²/8² ≤ 1;    w ≥ 0","formulaSize":34,"steps":["El centro local está en la base del depósito.","Los semiejes son 18, 14 y 8 m.","Tomamos solo la mitad superior."],"result":"36 × 28 × 8 m","resultSize":35,"resultCaption":"dimensiones completas","meaning":"El sólido matemático es un semielipsoide; la estructura física necesitaría otra verificación."},{"phase":"VI · CAMBIO DE VARIABLES","title":"De semiesfera a depósito","formula":"u=18ρ senφ cosθ;  v=14ρ senφ senθ;  w=8ρ cosφ","formulaSize":31,"steps":["ρ va de 0 a 1; φ de 0 a π/2.","θ completa la vuelta de 0 a 2π.","El estiramiento corrige dV con su jacobiano."],"result":"2016ρ² senφ","resultSize":37,"resultCaption":"factor de volumen","meaning":"Los límites quedan constantes; en cartesianas las raíces anidadas hacen la cuenta más larga."},{"phase":"VI · INTEGRAL TRIPLE","title":"Demostrar la capacidad","formula":"V=∫[0,2π]∫[0,π/2]∫[0,1] 2016ρ² senφ dρ dφ dθ","formulaSize":32,"steps":["∫₀¹ρ² dρ = 1/3.","∫₀π/2 senφ dφ = 1.","∫₀²π dθ = 2π."],"result":"1344π m³","resultSize":43,"resultCaption":"≈ 4 222.301 m³","meaning":"2016·(1/3)·1·(2π) da la capacidad geométrica si el depósito está lleno."},{"phase":"VI · DENSIDAD Y MASA","title":"La cantidad de materia cambia","formula":"δ=920(1+0.04u/18−0.06w/8) kg/m³","formulaSize":33,"steps":["Comprobamos que δ es positiva en todo E.","Calculamos M=∭E δ dV.","El término lineal en u se cancela por simetría."],"result":"3.797 × 10⁶ kg","resultSize":37,"resultCaption":"masa del contenido supuesto","meaning":"δ mínima ≈ 853.658 kg/m³. Esta densidad es una hipótesis del modelo."},{"phase":"VI · MOMENTOS","title":"Dónde se concentra la masa","formula":"(ū,v̄,w̄)=1/M(∭E uδdV, ∭E vδdV, ∭E wδdV)","formulaSize":31,"steps":["Cada momento pesa una coordenada por δ.","La simetría en v deja v̄=0.","Dividimos los tres momentos entre M."],"result":"(0.147, 0, 2.971) m","resultSize":34,"resultCaption":"centro de masa local","meaning":"La altura es 37.14 % de h. La proyección cae dentro de la base, sin certificar estructura."},{"phase":"SÍNTESIS","title":"Cuatro decisiones medibles","formula":"B⁺  ·  ruta  ·  región R  ·  depósito E","formulaSize":38,"steps":["Llegada: 3.788 % de pendiente en B⁺.","Ruta: 226.205 m; suelo real de R: 623.365 m².","Reserva: 4 222.301 m³; centro a 2.971 m."],"result":"un diseño","resultSize":45,"resultCaption":"coherente dentro del modelo","meaning":"Terreno sintético, cargas y servicios parciales: todavía no es una construcción certificada."}];
const cues={};
const el=document.getElementById('slide'), status=document.getElementById('status'), cue=document.getElementById('cue'), bar=document.getElementById('bar');
let index=Math.max(0,Math.min(21,Number(new URLSearchParams(location.search).get('scene')||1)-1)), reveal=0;
const E=(tag,className,text)=>{const n=document.createElement(tag);n.className=className;n.textContent=text;return n};
function draw(){const d=slides[index];el.replaceChildren();el.append(E('div','phase',d.phase),E('div','count','ESCENA '+String(index+1).padStart(2,'0')+' / 22'),E('h1','title',d.title));
 const fw=E('div','formula-wrap reveal','');fw.append(E('div','eyebrow','RELACIÓN QUE DEFENDEMOS'));const formula=E('div','formula'+(d.formula.length>69?' verylong':d.formula.length>49?' long':''),d.formula);if(index===18){formula.className='formula visual-integral';formula.innerHTML='V = <span class="math-int">∫<sup>2π</sup><sub>0</sub></span><span class="math-int">∫<sup>π/2</sup><sub>0</sub></span><span class="math-int">∫<sup>1</sup><sub>0</sub></span>2016ρ² senφ dρ dφ dθ'}fw.append(formula);el.append(fw);
 el.append(E('div','procedure-label','CÓMO SE OBTIENE'));const steps=E('div','steps','');d.steps.forEach((s,j)=>{const x=E('div','step reveal','');x.append(E('span','step-index',String(j+1).padStart(2,'0')),E('span','',s));steps.append(x)});el.append(steps);
 const r=E('div','result reveal','');r.append(E('div','result-label','RESULTADO'));r.append(E('div','result-value'+(d.result.length>22?' verylong':d.result.length>16?' long':''),d.result));r.append(E('div','result-caption',d.resultCaption));el.append(r);
 const m=E('div','meaning reveal','');m.append(E('div','meaning-label','QUÉ SIGNIFICA'),E('div','meaning-text',d.meaning));el.append(m);
 [...el.querySelectorAll('.reveal')].forEach((x,j)=>x.classList.toggle('shown',j<reveal));status.textContent=(index+1)+'/22 · paso '+reveal+'/6';cue.textContent=cues[index+1]||'';bar.style.width=(((index*6+reveal)/(22*6))*100)+'%';document.getElementById('prev').disabled=index===0&&reveal===0;document.getElementById('next').disabled=index===21&&reveal===6;
 const params=new URLSearchParams(location.search);params.set('scene',String(index+1));history.replaceState(null,'','?'+params);
}
function forward(){if(reveal<6)reveal++;else if(index<21){index++;reveal=0}draw()}
function back(){if(reveal>0)reveal--;else if(index>0){index--;reveal=6}draw()}
document.getElementById('next').onclick=forward;document.getElementById('prev').onclick=back;
document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();forward()}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();back()}else if(e.key.toLowerCase()==='f'){document.getElementById('full').click()}});
draw();
</script>
</body>
</html>
